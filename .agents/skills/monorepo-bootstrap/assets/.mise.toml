# この文書はハーネスが前提とするツールバージョンの正本である。ここに列挙した
# ツールだけが hooks / CI からの解決を保証される（外部契約は .claude/hooks/README.md
# 「外部契約 4 点」を参照）。個々のツールを選んだ理由や代替案の比較はここに書かず、
# 技術選定の記録は docs/notes/research/ または該当 ADR に置く。
#
# 既定スタックは node / pnpm / jq / gitleaks の 4 つに絞っている。他言語・他ツールの
# 採用は下の「スタック別追加例」を参考に、mise がサポートする backend
# （core / asdf plugin / npm: / github: 等）で追記する。
#
# pin の注意:
# - pnpm は dual-pin である。package.json の "packageManager" と下の "npm:pnpm" を
#   同時に同じ版へ更新する（片方だけ更新すると、CI と local で pnpm の版がずれる）。
# - 版は一次情報（公式のリリース一覧）で実在を確認した値を pin する。node は bootstrap 時点の
#   最新の LTS 系列から、公式のリリース一覧に実在する最新の patch を pin する。

[tools]
node = "22.23.3"
"npm:pnpm" = "11.24.0"
# hooks の JSON 入出力や CLI 出力の抽出に使う。
jq = "1.8.2"
# シークレット誤コミット検知（pre-push hook で使う。CI では実行しない）。
gitleaks = "8.30.1"

# --- スタック別追加例（採用時にコメントアウトを外して pin する） ---------------
# <tool> = "<version>"                                  # core / asdf backend
# "npm:<package>" = "<version>"                         # npm backend
# "github:<owner>/<repo>" = { version = "<version>", exe = "<binary>" }   # github backend
# -------------------------------------------------------------------------------
