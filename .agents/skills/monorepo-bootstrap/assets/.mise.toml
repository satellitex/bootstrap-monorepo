# この文書はハーネスが前提とするツールバージョンの正本である。ここに列挙した
# ツールだけが hooks / CI からの解決を保証される（外部契約は .claude/hooks/README.md
# 「外部契約 4 点」を参照）。個々のツールを選んだ理由や代替案の比較はここに書かず、
# 技術選定の記録は docs/notes/research/ または該当 ADR に置く。
#
# 既定スタックは node 22 / pnpm / jq / gitleaks の 4 つに絞っている。他言語・他ツールの
# 採用は下の「スタック別追加例」を参考に、mise がサポートする backend
# （asdf plugin / npm: / github: 等）で追記する。

[tools]
node = "22.23.2"
"npm:pnpm" = "11.24.0"
# aws-cli / terraform の JSON 出力抽出や、hooks の JSON 入出力に使う。
jq = "1.8.2"
# シークレット誤コミット検知（pre-push hook + CI の secret scan で使う）。
gitleaks = "8.30.1"

# --- スタック別追加例（採用時にコメントアウトを外して pin する） ---------------
# Rust:
# rust = "1.90.0"
# Go:
# go = "1.25.0"
# Python:
# python = "3.13.0"
# Terraform / IaC を採用する場合:
# terraform = "1.15.8"
# aws-cli = { version = "2.36.20", symlink_bins = "true" }
# ドキュメントサイトを mdBook で作る場合:
# "github:rust-lang/mdBook" = { version = "0.5.4", exe = "mdbook" }
