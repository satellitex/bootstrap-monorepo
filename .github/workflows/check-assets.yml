name: Template checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .agents/skills/monorepo-bootstrap/scripts/check-assets.sh
